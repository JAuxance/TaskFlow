 tâche → projet ; message privé → membres ; erreur → connexion ; navigation → workspaces / workspace.</text><text x="62" y="958" font-size="15" fill="#475467">Nouvelle tâche : Owner, Admin, Member. Guest : consultation. Créer / annuler revient au Kanban.</text><text x="62" y="983" font-size="15" fill="#475467">Paramètres et profil existent dans l’application ; ils restent hors de cette sélection de planches.</text></g></svg>