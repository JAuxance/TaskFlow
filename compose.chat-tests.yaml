name: taskflow-chat-tests
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taskflow_chat_test
      POSTGRES_USER: taskflow_test
      POSTGRES_PASSWORD: local_chat_test_only
    ports:
      - "127.0.0.1:55438:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_test -d taskflow_chat_test"]
      interval: 1s
      timeout: 3s
      retries: 30
