# Proposed production site. Review alongside the active file before installation.
server {
    listen 80;
    listen [::]:80;
    server_name taskflow.auxance.dev;
    return 301 https://taskflow.auxance.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name taskflow.auxance.dev;
    ssl_certificate /etc/letsencrypt/live/taskflow.auxance.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskflow.auxance.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/taskflow;
    index index.html;
    client_max_body_size 6M;

    include /etc/nginx/taskflow/cloudflare-real-ip.conf;
    include /etc/nginx/taskflow/security-headers.conf;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    location /api/ {
        include /etc/nginx/taskflow/proxy-headers.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /socket.io/ {
        include /etc/nginx/taskflow/proxy-headers.conf;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /static/ {
        include /etc/nginx/taskflow/proxy-headers.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location = /health {
        include /etc/nginx/taskflow/proxy-headers.conf;
        proxy_pass http://127.0.0.1:5000/health;
    }

    location / {
        include /etc/nginx/taskflow/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
