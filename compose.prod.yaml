name: taskflow-prod

services:
  backend:
    build: .
    container_name: taskflow_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: taskflow
      DATABASE_USER: taskflow_app
      DATABASE_PASSWORD: ${DATABASE_APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      RATELIMIT_STORAGE_URI: redis://redis:6379
      DELETION_LOG_PATH: /var/taskflow/deletions.log
    volumes:
      - avatars_data:/app/app/static/avatars
      - workspace_icons_data:/app/app/static/workspace_icons
      - deletion_log:/var/taskflow
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17
    container_name: taskflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/sql/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./app/sql/02-create-app-user.sh:/docker-entrypoint-initdb.d/02-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: taskflow_redis
    restart: unless-stopped

volumes:
  postgres_data:
  avatars_data:
  workspace_icons_data:
  deletion_log:
